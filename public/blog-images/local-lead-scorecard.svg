<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Local lead scorecard</title>
  <desc id="desc">A scorecard for ranking leads by fit, need, value, route, and timing.</desc>
  <rect width="1200" height="720" rx="32" fill="#10201A"/>
  <rect x="70" y="58" width="1060" height="604" rx="30" fill="#152923" stroke="#29493F" stroke-width="2"/>
  <text x="110" y="128" fill="#F6FFF9" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="850">Local lead scorecard</text>
  <text x="110" y="168" fill="#AFCAC1" font-family="Inter, Arial, sans-serif" font-size="22">Save the prospect only when the score supports a real next step.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750">
    <rect x="110" y="226" width="980" height="74" rx="18" fill="#0F1A17"/>
    <text x="146" y="272" fill="#FFFFFF">Signal</text>
    <text x="590" y="272" fill="#FFFFFF">Question</text>
    <text x="1010" y="272" fill="#FFFFFF" text-anchor="end">Score</text>
    <g fill="#DDF8E7" font-weight="700">
      <rect x="110" y="320" width="980" height="64" rx="16" fill="#1E3A32"/>
      <text x="146" y="360">Fit</text><text x="360" y="360">Does the business match the offer?</text><text x="1010" y="360" text-anchor="end">5</text>
      <rect x="110" y="398" width="980" height="64" rx="16" fill="#1B342D"/>
      <text x="146" y="438">Need</text><text x="360" y="438">Is the website or funnel gap visible?</text><text x="1010" y="438" text-anchor="end">4</text>
      <rect x="110" y="476" width="980" height="64" rx="16" fill="#1E3A32"/>
      <text x="146" y="516">Value</text><text x="360" y="516">Could the work justify the outreach?</text><text x="1010" y="516" text-anchor="end">4</text>
      <rect x="110" y="554" width="980" height="64" rx="16" fill="#1B342D"/>
      <text x="146" y="594">Route</text><text x="360" y="594">Is there a respectful contact path?</text><text x="1010" y="594" text-anchor="end">5</text>
    </g>
  </g>
  <circle cx="1012" cy="132" r="54" fill="#9AE66E"/>
  <text x="1012" y="147" fill="#10201A" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" text-anchor="middle">18</text>
</svg>
