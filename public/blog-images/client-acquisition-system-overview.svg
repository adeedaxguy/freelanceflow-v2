<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Client acquisition workflow overview</title>
  <desc id="desc">A five step workflow from lead discovery to qualification, pitch, call, and follow-up.</desc>
  <rect width="1200" height="720" rx="32" fill="#071319"/>
  <rect x="48" y="48" width="1104" height="624" rx="28" fill="#0E1F2A" stroke="#214150" stroke-width="2"/>
  <text x="88" y="120" fill="#EAFBFF" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">Client acquisition system</text>
  <text x="88" y="162" fill="#9FC4CC" font-family="Inter, Arial, sans-serif" font-size="22">Find, qualify, pitch, call, and follow up from one lead record.</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(88 244)">
      <rect width="184" height="196" rx="22" fill="#122B36" stroke="#3AD8FF" stroke-opacity=".45" stroke-width="2"/>
      <circle cx="92" cy="62" r="30" fill="#3AD8FF"/>
      <path d="M80 62h24M92 50v24" stroke="#071319" stroke-width="8" stroke-linecap="round"/>
      <text x="26" y="128" fill="#FFFFFF" font-size="24" font-weight="800">Lead</text>
      <text x="26" y="160" fill="#9FC4CC" font-size="17">Find buyer</text>
    </g>
    <g transform="translate(298 244)">
      <rect width="184" height="196" rx="22" fill="#122B36" stroke="#9AE66E" stroke-opacity=".45" stroke-width="2"/>
      <circle cx="92" cy="62" r="30" fill="#9AE66E"/>
      <path d="M78 63l10 10 20-25" stroke="#071319" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="128" fill="#FFFFFF" font-size="24" font-weight="800">Score</text>
      <text x="26" y="160" fill="#9FC4CC" font-size="17">Qualify fit</text>
    </g>
    <g transform="translate(508 244)">
      <rect width="184" height="196" rx="22" fill="#122B36" stroke="#FFD166" stroke-opacity=".5" stroke-width="2"/>
      <circle cx="92" cy="62" r="30" fill="#FFD166"/>
      <path d="M76 57h32M76 72h23" stroke="#071319" stroke-width="7" stroke-linecap="round"/>
      <text x="26" y="128" fill="#FFFFFF" font-size="24" font-weight="800">Pitch</text>
      <text x="26" y="160" fill="#9FC4CC" font-size="17">Use proof</text>
    </g>
    <g transform="translate(718 244)">
      <rect width="184" height="196" rx="22" fill="#122B36" stroke="#FF6B9A" stroke-opacity=".45" stroke-width="2"/>
      <circle cx="92" cy="62" r="30" fill="#FF6B9A"/>
      <path d="M82 50c12 34 28 50 42 56l-11 12c-23-8-39-26-47-50l16-18z" fill="#071319"/>
