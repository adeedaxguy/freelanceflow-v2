  <path d="M272 342h26M482 342h26M692 342h26M902 342h26" stroke="#DDF8FF" stroke-opacity=".45" stroke-width="6" stroke-linecap="round"/>
  <rect x="88" y="512" width="1024" height="82" rx="20" fill="#071319" stroke="#214150"/>
  <text x="120" y="562" fill="#CDEEF4" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">SEO focus: connect buyer-intent keywords to a complete action path, not isolated articles.</text>
