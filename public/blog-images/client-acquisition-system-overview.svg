      <text x="26" y="160" fill="#9FC4CC" font-size="17">When ready</text>
    </g>
    <g transform="translate(928 244)">
      <rect width="184" height="196" rx="22" fill="#122B36" stroke="#A88BFF" stroke-opacity=".5" stroke-width="2"/>
      <circle cx="92" cy="62" r="30" fill="#A88BFF"/>
